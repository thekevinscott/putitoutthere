name: Setup pnpm
description: Installs the pnpm major this repo's own CI builds with.

# Single source of truth for the pnpm major that builds *this* repo.
# Deliberately not derived from `engines.pnpm` (the published package's
# consumer contract) nor used by consumer-facing install steps. All are
# "11" by coincidence, not coupling; deriving one would freeze the others.
runs:
  using: composite
  steps:
    - shell: bash
      run: npm install -g pnpm@11
