name: Setup Node
description: Provisions the Node version this repo's own CI builds with.

# Single source of truth for the Node version that builds *this* repo.
# Deliberately not derived from `engines.node` (what the published package
# supports) nor shared with _matrix.yml / release.yml (what we install into
# a consumer's checkout). All read 24 by coincidence, not coupling.

inputs:
  registry-url:
    description: >-
      Optional npm registry to authenticate against. Set only by the
      three publish steps that need an auth-scoped .npmrc; empty
      elsewhere, which setup-node treats as "no auth setup".
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: ${{ inputs.registry-url }}
