# testing-conventions config — packages/engine only (wired via the engine job's
# `config:` input in .github/workflows/conventions.yml).
#
# This file exists ONLY to set the one_function_per_file ratchet. It
# intentionally sets no coverage floors, lint rules, or other options, so every
# other gate (unit/integration lint, coverage, ci mutation) keeps its built-in
# defaults.
#
# `one_function_per_file`: per maintainer ruling, downstream consumers set
# their own threshold — upstream's default (max_lines = 1) stays put. A file
# fails only when two or more module-scope functions exceed max_lines, so the
# binding ceiling is the largest *second* function in any one file. Current
# ceiling on packages/engine/src: version.ts (bump, beside parseSemver) and
# python-versions.ts (resolvePythonVersions) — so 9 is the floor until they split.
# Ratchet this down as the one-function-per-file refactor (#680)
# progresses; do not raise.
[typescript]
one_function_per_file = { max_lines = 9 }
