# testing-conventions config — packages/engine only (wired via the engine job's
# `config:` input in .github/workflows/conventions.yml).
#
# This file exists ONLY to lift a genuinely-equivalent mutation mutant (see
# reason below) and to set the one_function_per_file ratchet. It intentionally
# sets no coverage floors, lint rules, or other options, so every other gate
# (unit/integration lint, coverage, ci mutation) keeps its built-in defaults.
#
# `one_function_per_file`: per maintainer ruling, downstream consumers set
# their own threshold — upstream's default (max_lines = 1) stays put. A file
# fails only when two or more module-scope functions exceed max_lines, so the
# binding ceiling is the largest *second* function in any one file. Current
# ceiling on packages/engine/src: crates.ts, where scanDirtyOutsideManifest
# (59 lines) shares the file with publishImpl — 60 clears it. Ratchet this
# down as the one-function-per-file refactor (#680) progresses; do not raise.
[typescript]
one_function_per_file = { max_lines = 60 }

[[typescript.exempt]]
path = "plan.ts"
lines = [130]
rules = ["mutation"]
reason = "`if (cascaded.size === 0) { return []; }` — the ConditionalExpression->false and BlockStatement->{} mutants (which remove the early return) are equivalent. When the cascade set is empty the subsequent row-building loop iterates nothing and returns [] anyway, so removing the early-out produces identical observable output. (The ConditionalExpression->true 'always return []' variant IS killed by the many non-empty-cascade tests.)"
