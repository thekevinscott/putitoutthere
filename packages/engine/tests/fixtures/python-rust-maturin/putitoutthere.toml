[putitoutthere]
version = 1

[[package]]
name = "piot-fixture-zzz-python-maturin"
kind = "pypi"
path = "."
globs = ["src/**", "Cargo.toml", "pyproject.toml"]
build = "maturin"
# #610: build linux wheels inside the manylinux_2_28 container so the
# platform tag is the requested baseline, not the runner's glibc. The
# e2e job's `verify wheel --manylinux` asserts the produced filename.
manylinux = "2_28"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
first_version = "__VERSION__"
