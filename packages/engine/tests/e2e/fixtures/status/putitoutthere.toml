# Live packages on the real registries. The npm and crates rows are piot
# fixtures (tests/fixtures/README.md); the PyPI row is a third-party project,
# read-only, because CI no longer uploads to PyPI (#815). `status` reads each
# one's real latest version; with no local tag, each is published-but-untagged.
[putitoutthere]
version = 1

[[package]]
name  = "fixture-rust"
kind  = "crates"
crate = "piot-fixture-zzz-poly-rust"
path  = "packages/rust"
globs = ["packages/rust/**"]

[[package]]
name  = "fixture-npm"
kind  = "npm"
npm   = "@putitoutthere/piot-fixture-zzz-js-vanilla"
path  = "packages/npm"
globs = ["packages/npm/**"]

[[package]]
name  = "fixture-py"
kind  = "pypi"
pypi  = "iniconfig"
build = "hatch"
path  = "packages/py"
globs = ["packages/py/**"]
