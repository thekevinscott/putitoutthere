name: 'Put It Out There (internal)'
description: 'Internal step-level wrapper around the putitoutthere CLI. Consumers compose with the reusable workflow at .github/workflows/release.yml@v0, not with this action directly. See notes/design-commitments.md non-goal #10.'
author: 'Kevin Scott'

inputs:
  command:
    description: 'Which CLI subcommand to run. Canonical values are `plan`, `publish`, `write-version`, `check`, `release-github`, `reconcile`, and `verify-bundle-cli`.'
    required: false
    default: 'plan'
  working_directory:
    description: >-
      Path the CLI runs against. For `plan` / `publish`, forwarded as
      `--cwd`. For `write-version` (#276), forwarded as `--path` —
      the package directory whose pyproject.toml / Cargo.toml gets
      bumped. For `verify-bundle-cli` (#595), also forwarded as
      `--path` — the package directory whose built wheel lives under
      `<path>/dist`. Defaults to the runner working directory. Internal use;
      the reusable workflow supplies this when invoked against a
      non-root tree (e.g. e2e fixtures materialized into a subdir,
      or a per-package `matrix.path`).
    required: false
    default: ''
  version:
    description: >-
      Planned version string. Required when `command: write-version`
      (#276); ignored otherwise. The reusable workflow forwards the
      build matrix's `version` row from the planner.
    required: false
    default: ''
  release_packages:
    description: >-
      Manual-release spec, forwarded to `plan` / `publish` as
      `--release-packages`. Comma-separated `name[@<bump|version>]`
      entries; when set, change detection is bypassed and exactly the
      named packages are released. Empty => normal change-detected
      planning. Ignored for other commands.
    required: false
    default: ''
  stage_to:
    description: >-
      The `[package.bundle_cli].stage_to` directory the cross-compiled
      binary was staged into, forwarded to `verify-bundle-cli` as
      `--stage-to` (#595). Any `[tool.maturin].python-source` prefix is
      subtracted from it before the in-wheel path is built, because
      maturin strips that directory from the wheel layout. Required
      when `command: verify-bundle-cli`; ignored otherwise.
    required: false
    default: ''
  bin:
    description: >-
      The `[package.bundle_cli].bin` name, forwarded to
      `verify-bundle-cli` as `--bin` (#595). Gains a `.exe` suffix on a
      Windows `target`. Required when `command: verify-bundle-cli`;
      ignored otherwise.
    required: false
    default: ''
  target:
    description: >-
      The build matrix row's target triple, forwarded to
      `verify-bundle-cli` as `--target` (#595). A triple containing
      `windows` selects the `.exe` binary suffix. Required when
      `command: verify-bundle-cli`; ignored otherwise.
    required: false
    default: ''
  fail_on_error:
    description: 'If true, non-zero CLI exit codes fail the step.'
    required: false
    default: 'true'

outputs:
  matrix:
    description: "JSON matrix emitted by `plan`. Output key is omitted when the plan resolves to zero rows or when command is anything other than plan; downstream jobs should coalesce with `|| '[]'`."

runs:
  using: 'node24'
  main: 'dist-action/index.js'
