# Keeps our deps + actions fresh. PRs are grouped so we don't drown in
# single-dep bumps every week; security updates go out as separate PRs
# immediately.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Hold the vitest family at 4 until the TypeScript mutation gate can run on
    # vitest 5 (#715): testing-conventions' Stryker vitest runner executes zero
    # tests per mutant there, so the gate refuses to run and every PR touching
    # source goes red. Without this, Dependabot re-proposes the 5 major each
    # week and re-creates that deadlock. Remove this entry — not the group
    # above — once #715 is resolved; the group must keep naming `major` so the
    # version-locked family still upgrades as one PR.
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      # `vitest` and `@vitest/*` must move as ONE PR, majors included.
      # @vitest/coverage-v8 is version-locked to the vitest runtime it
      # instruments, so a split bump mismatches them and vitest aborts:
      #   Loaded  vitest@5.0.1  and  @vitest/coverage-v8@4.1.11 .
      #   Running mixed versions is not supported and may lead into bugs
      #   Update your dependencies and make sure the versions match.
      # which cascaded into 139 unhandled `TypeError: Expected string coverage
      # payload, received object` and left both halves of the 4 -> 5 upgrade
      # structurally un-greenable (#705 bumped vitest alone, #706 bumped
      # coverage-v8 alone; neither could pass the coverage gates by itself).
      # `dev-dependencies` below cannot carry this: it is scoped to
      # minor+patch, and a *major* matches no group at all, so Dependabot
      # falls back to one PR per package. Listed first because a dependency
      # joins the first group whose rules it matches, and it names every
      # update-type so this family can never split again.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      runtime-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      gha:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope
