name: E2E

on:
  # The expensive lane: 15 fixtures publishing for real to crates.io, PyPI,
  # TestPyPI and npm over OIDC. Scope is "anything the fixture run actually
  # executes":
  #   packages/**   the engine under test, the packages/ci gates the job
  #                 shells out to, the fixture trees themselves
  #                 (packages/engine/tests/fixtures/**), and the
  #                 setup-node/setup-pnpm composites
  #   action.yml    e2e-fixture-job.yml drives the engine via `uses: ./`
  #   e2e-fixture-job.yml  the reusable child this matrix calls
  #
  # Deliberately NOT triggers: release.yml, _matrix.yml, build.yml, check.yml.
  # e2e-fixture-job.yml mirrors them but never invokes them, so a run here
  # yields no signal on a change to one. The mirror itself is pinned by the
  # unit tier (test/workflows: cargo-cache, napi-crate-version,
  # publish-github-token), which test.yml triggers on `.github/workflows/**`.
  # putitoutthere.toml is out for the same reason — the job materializes each
  # fixture's own config, never the repo's.
  #
  # `packages/**` rather than an enumeration of the four piot-ci gates the lane
  # actually shells out to (fixture-materialize, cargo-registry,
  # verdaccio-auth, testpypi-verify). The enumeration would be tighter — a
  # changelog-gate refactor would stop costing 15 real publishes — but it only
  # stays correct while someone remembers to extend it, and the PR that adds a
  # fifth gate edits e2e-fixture-job.yml (so it runs) while the NEXT PR
  # touching only that gate would silently skip the lane. Over-running costs a
  # wave; under-running ships an unexercised publish path. Making this precise
  # is #701's job (`scope`, which derives the set from file contents), not a
  # static glob's.
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'action.yml'
      - '.github/workflows/e2e-fixture-job.yml'
      - '.github/workflows/e2e-fixture.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_no_dist:
        description: >-
          #304 / #256 repro toggle. When true, first-publish fixtures clobber
          their `dist/` directory after build but before publish, so the
          post-publish tarball-verify step fails. Use to demonstrate that
          the verify step actually catches missing build output against
          the empty Verdaccio. Off by default.
        type: boolean
        required: false
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (${{ matrix.fixture }})
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - js-vanilla
          - js-vanilla-first-publish
          - js-napi
          - js-napi-first-publish
          - js-bundled-cli
          - js-bundled-cli-first-publish
          - js-python-no-rust
          - js-python-no-rust-first-publish
          - python-pure-hatch
          - python-pure-sdist-only
          - python-rust-maturin
          - python-rust-maturin-workspace-first-publish
          - polyglot-everything
          - polyglot-everything-first-publish
          - rust-vanilla-first-publish
    uses: ./.github/workflows/e2e-fixture-job.yml
    secrets: inherit
    with:
      fixture: ${{ matrix.fixture }}
      simulate_no_dist: ${{ inputs.simulate_no_dist || false }}

  # pypa/gh-action-pypi-publish aborts inside reusable workflows
  # (warehouse#11096), so PyPI upload has to live at the caller level.
  # See notes/audits/2026-04-28-pypi-tp-reusable-workflow-constraint.md.
  pypi-publish:
    needs: e2e
    runs-on: ubuntu-latest
    environment: e2e
    permissions:
      id-token: write
    outputs:
      # #718: the `pypi-tag` job below has to key off whether this job
      # actually uploaded anything. An undeclared job output expands to the
      # empty string rather than erroring, so without this line `pypi-tag`
      # would silently never fire — the same shape of silent miss #694 was.
      have_pypi: ${{ steps.have-pypi.outputs.have_pypi }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-sdist'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-wheel-*'
          path: dist/
          merge-multiple: true
      # #294: discard first-publish wheels/sdists. They carry a literal
      # `_placeholder` token in the project-name half of the filename
      # (maturin normalizes the fixture's `-placeholder` suffix to
      # `_placeholder` in wheel/sdist filenames; the build job's
      # materialize step does NOT apply the `-placeholder` rewrite, by
      # design — see e2e-fixture-job.yml's plan/publish materialize
      # comments). Real PyPI has no Trusted Publisher record for these
      # uniquified names, so the pypa-publish PUT would 4xx. The
      # diagnostic surface that the maturin path provides on a
      # first-publish fixture is the in-job wheel-content guard
      # (e2e-fixture-job.yml lines ~233-274), not the upload to a
      # real registry — TP-shaped failure modes are explicitly out of
      # scope per issue 294.
      - name: Discard first-publish wheels (no TP record on real PyPI)
        run: |
          set -euo pipefail
          dropped=0
          while IFS= read -r -d '' f; do
            rm -f "$f"
            dropped=$((dropped + 1))
            echo "  dropped: $(basename "$f")"
          done < <(find dist/ -maxdepth 1 -type f \
            \( -name '*_placeholder*' -o -name '*-placeholder*' \) -print0 2>/dev/null)
          if [ "$dropped" -gt 0 ]; then
            echo "::warning::Dropped ${dropped} first-publish artifact(s) from dist/ — Trusted Publisher records are not provisioned for uniquified package names. The maturin build path on a first-publish fixture is guarded by the in-job wheel-content guard, not by the real-PyPI upload."
          fi
      - id: have-pypi
        run: |
          if [ -n "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "have_pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_pypi=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.have-pypi.outputs.have_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # #718: the hop AFTER the upload. `pypi-publish` ended at
  # pypa/gh-action-pypi-publish, so the half of the PyPI release path that
  # consumers actually run — `reconcile --expect` cutting the tag for what
  # was just uploaded — had no coverage anywhere in the repo. That is why
  # #694 (reconcile reading PyPI's mutable project pointer and tagging
  # nothing) shipped invisibly: every gate it would have tripped was a unit
  # test against a mocked registry.
  #
  # This job MIRRORS pypi-tag.yml's documented consumer shape rather than
  # calling it, for three independent reasons:
  #
  #   1. pypi-tag.yml pins `uses: thekevinscott/putitoutthere@v0`, so
  #      calling it would exercise the RELEASED action, not the PR's — the
  #      opposite of what an e2e lane is for. `./` cannot be substituted
  #      inside it either: for a cross-repo reusable workflow `./` resolves
  #      against the CONSUMER's checkout, and workflow-yaml-invariants
  #      pins the inner refs at `@v0` on purpose.
  #   2. pypi-tag.yml reads the calling repo's own putitoutthere.toml, whose
  #      package set does not contain the fixture projects — `reconcile
  #      --expect` would throw `"…" is not a package name`.
  #   3. It pushes tags. Run here that would put fixture tags
  #      (`piot-fixture-zzz-python-hatch-v0.0.…`) on this repo's remote on
  #      every e2e wave.
  #
  # So reconcile runs for real, against real PyPI, over the real artifacts
  # the upload just shipped — but in a throwaway git tree under
  # RUNNER_TEMP with NO remote. `ensureTag` creates the tag locally and its
  # push is already warn-only (#717), so the tag is observable without the
  # repo's tag namespace ever being touched. `--dry-run` was not an option:
  # action.yml exposes no `dry_run` input, and a dry run would not exercise
  # `ensureTag` at all, which is the half that silently did nothing.
  pypi-tag:
    name: PyPI tag reconcile + verify
    needs: pypi-publish
    # Mirrors the consumer template's gate (see pypi-tag.yml's usage block)
    # plus the `have_pypi` arm: `pypi-publish` skips its upload when
    # `dist/` came back empty (#294 drops every first-publish artifact,
    # and `simulate_no_dist` can empty it outright), and there is nothing
    # to reconcile against a registry that received nothing.
    if: ${{ !cancelled() && needs.pypi-publish.result == 'success' && needs.pypi-publish.outputs.have_pypi == 'true' }}
    runs-on: ubuntu-latest
    # Read-only: the tags this job cuts are local to $TAG_TREE by design.
    # If a refactor ever points reconcile at the checkout instead, the push
    # fails on permissions rather than landing a fixture tag on main.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Outside the checkout deliberately. A tree that somehow lacked `.git`
      # would let git walk UP to the repo and tag that; RUNNER_TEMP has no
      # repository above it. Exported here rather than in a job-level `env:`
      # because the `runner` context is not available at job level — see the
      # `${RUNNER_TEMP}` precedent in e2e-fixture-job.yml. Via GITHUB_ENV so
      # both the `run:` steps and the action's `with:` can read it.
      - name: Site the throwaway tag tree outside the checkout
        run: echo "TAG_TREE=${RUNNER_TEMP}/piot-pypi-tag" >> "$GITHUB_ENV"
      - uses: ./packages/ci/actions/setup-node
      - uses: ./packages/ci/actions/setup-pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build engine + action bundle
        run: |
          pnpm run build
          pnpm run build:action
      # Same two patterns `pypi-publish` downloaded, so the expectation is
      # derived from the same bytes that were uploaded.
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-sdist'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-wheel-*'
          path: dist/
          merge-multiple: true
      # Reads `dist/` back into `[{name, version, tag}]` — the same shape
      # release.yml's `delegated_packages` output carries, which is what the
      # consumer template feeds `expect`. The fixture matrix cannot hand it
      # over directly: e2e-fixture-job.yml declares no workflow_call
      # outputs, and a matrix job's outputs overwrite each other anyway.
      # Applies #294's placeholder filter so the expectation names exactly
      # the projects the upload was given.
      - id: expect
        name: Derive what the PyPI upload shipped
        run: pnpm exec piot-ci pypi-tag-verify prepare
      - name: Tag every published version that has no tag
        uses: ./
        with:
          command: reconcile
          working_directory: ${{ env.TAG_TREE }}
          expect: ${{ steps.expect.outputs.expect }}
      # The assertion #694 needed and nothing had: every version that is on
      # PyPI carries a tag. reconcile exits 0 having done nothing when it
      # asks the wrong question, so its exit code is not the signal.
      - name: Assert a tag was cut for every uploaded version
        run: pnpm exec piot-ci pypi-tag-verify assert

  # #295: PyPI is the only registry with a public test instance whose
  # upload semantics match production closely enough to catch warehouse-
  # shaped failures before consumers hit them. Keep this as a separate
  # caller-side publish job for the same reason as `pypi-publish` above:
  # pypa/gh-action-pypi-publish aborts inside nested reusable workflows.
  testpypi-publish:
    name: TestPyPI publish + verify
    needs: e2e
    runs-on: ubuntu-latest
    environment: e2e
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Toolchain for `pnpm exec piot-ci`. Checkout runs before the
      # artifact downloads so its workspace clean does not wipe dist/.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./packages/ci/actions/setup-node

      - uses: ./packages/ci/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: 'piot-fixture-zzz-python-maturin-sdist'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: 'piot-fixture-zzz-python-maturin-wheel-*'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: 'piot-fixture-zzz-python-hatch-sdist'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: 'piot-fixture-zzz-python-hatch-wheel-any'
          path: dist/
          merge-multiple: true

      - name: Assert TestPyPI fixture artifacts exist
        run: pnpm exec piot-ci testpypi-verify assert

      # #669: skip-existing keeps the upload idempotent so `gh run rerun
      # --failed` can reach the verify step below. The fixture version is
      # fixed for a run, so a re-upload only duplicates this run's own files.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

      - name: Verify TestPyPI artifact metadata
        env:
          TESTPYPI_INDEX_URL: https://test.pypi.org/simple/
        run: pnpm exec piot-ci testpypi-verify metadata
