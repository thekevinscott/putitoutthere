name: Changelog check

# Enforces AGENTS.md's changelog policy: a PR touching public surface must
# add a fragment to changelog.d/ and migrations.d/ (#730). Opt out with a
# `skip-changelog:` commit trailer. Gate logic is tested TypeScript in
# packages/ci/src/changelog-check/ (#452, epic #442).

# Paths are a deliberate SUPERSET of the gate's own `SURFACE_PATHSPECS`
# (packages/ci/src/changelog-check/run.ts); they only decide whether the
# decision is worth a runner. Keep it a superset -- narrowing below the
# globset lets a surface-changing PR merge with no entry and no red check.
# The fragment folders are listed so a misnamed fragment is caught.
on:
  pull_request:
    paths:
      - 'action.yml'
      - 'packages/engine/src/**'
      - 'docs/**'
      - 'changelog.d/**'
      - 'migrations.d/**'
      - 'packages/ci/src/changelog-check/**'
      - 'packages/ci/actions/**'
      - '.github/workflows/changelog-check.yml'

permissions:
  contents: read

jobs:
  check:
    name: Changelog check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./packages/ci/actions/setup-node

      - uses: ./packages/ci/actions/setup-pnpm

      - name: Install dependencies
        # packages/ci's `prepare` script builds its dist during install, so
        # `piot-ci` is linked into node_modules/.bin and resolvable below.
        run: pnpm install --frozen-lockfile

      - name: Enforce changelog + migration entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec piot-ci changelog-check
