name: E2E (CLI)

# Runs the node CLI e2e tier (tests/e2e/**/*.e2e.test.ts): vitest tests
# that shell out to the built CLI (a real `node` subprocess of the
# engine's bin) and hit the real registries, pointed at piot's own
# piot-fixture-zzz-* fixtures.
# Lighter than the fixture suite (e2e.yml): no publish happens, so it's
# reliable per-PR and its red->green is visible. See tests/e2e/README.md.

on:
  # Same input set as the integration tier, for the same reason:
  # resolve.e2e.test.ts shells the built CLI at the real repo root, and
  # `resolve` reads `.github/workflows/e2e-fixture-job.yml` and
  # packages/engine/tests/fixtures/. `packages/**` (not just
  # packages/engine/**) because `pnpm install --frozen-lockfile` runs every
  # workspace package's `prepare` build — a broken packages/ci/src fails the
  # install before a single test runs.
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'action.yml'
      - '.github/workflows/e2e-fixture-job.yml'
      - '.github/workflows/e2e-cli.yml'
  push:
    branches: [main]

concurrency:
  group: e2e-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-cli:
    name: e2e (CLI, live registries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./packages/ci/actions/setup-node

      - uses: ./packages/ci/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CLI e2e against live registries
        run: pnpm test:e2e
