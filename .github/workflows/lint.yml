name: Lint

on:
  # Typecheck and ESLint read the workspace only -- both packages' sources,
  # their configs, and the setup-node/setup-pnpm composites #653 moved under
  # packages/**. `.github/workflows/**` is deliberately absent: no job here
  # parses workflow YAML (actionlint.yml and test.yml cover that).
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./packages/ci/actions/setup-node

      - uses: ./packages/ci/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint
