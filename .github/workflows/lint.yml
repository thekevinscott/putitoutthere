name: Lint

on:
  # Typecheck (`tsc --noEmit`, include: src/**/*.ts) and ESLint (`eslint src`)
  # read the workspace and nothing else: both packages' sources, their
  # tsconfig/eslint configs, and the dependency graph that supplies the type
  # definitions and lint plugins. `packages/**` also carries the
  # setup-node/setup-pnpm composites this job runs (#653 moved them out of
  # .github/), so they are covered.
  #
  # `.github/workflows/**` is deliberately absent: no job here parses workflow
  # YAML. actionlint.yml lints it and test.yml's test/workflows tier asserts
  # against it.
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./packages/ci/actions/setup-node

      - uses: ./packages/ci/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint
