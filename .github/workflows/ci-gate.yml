name: CI Gate

# Aggregator check that turns green when every other required check on
# this PR has passed. Set this as the single required status check in
# branch protection rather than enumerating each workflow -- that way
# adding a new workflow doesn't require updating branch protection.
#
# Mirrors dirsql's pr-monitor pattern.

on:
  pull_request:

concurrency:
  # A superseded gate run polls a stale SHA until it finishes. Cancel it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  # willfire reads the PR and its changed files to predict which workflows dispatch.
  pull-requests: read

jobs:
  monitor:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: thekevinscott/pr-monitor@v1
        with:
          # pr-monitor gates on predicted *check names*, not workflow file
          # paths (upstream a981cd3d / 2dce0c87, 2026-08-21). A matrix built
          # from another job's `$GITHUB_OUTPUT` cannot be expanded statically,
          # so willfire refuses to guess and fails naming the job rather than
          # comparing against a set it knows has a hole in it. Without this
          # grant every PR here is red -- see #659.
          #
          # Two dynamic matrices need resolving, so we name the job that
          # computes each:
          #   testing-conventions `detect` -> static / unit-coverage /
          #     coverage-changed / mutation
          #   this repo's `plan` (e2e-fixture-job.yml) -> the per-fixture
          #     `build` matrix
          #
          # Since willfire 0.1.31 the names no longer narrow anything -- any
          # grant enables execution for the whole prediction. The granted jobs
          # run the PR's own code for real, in a docker sandbox, at the
          # predicted commit. The names stay for the log.
          #
          # Safe today because every PR here comes from a same-repo branch
          # (`claude/*`, `dependabot/*`), so nothing attacker-controlled
          # reaches the sandbox, and this workflow's `permissions:` block is
          # read-only throughout. Two conditions void that reasoning -- revisit
          # this grant if either arrives:
          #   - Fork PRs enabled on this repo. The sandbox has no timeout and
          #     no resource limits, and tarball extraction happens host-side,
          #     outside the container.
          #   - A `CI Gate` run landing on a self-hosted runner. The isolation
          #     argument assumes an ephemeral GitHub-hosted VM.
          execute: thekevinscott/testing-conventions:detect thekevinscott/putitoutthere:plan
