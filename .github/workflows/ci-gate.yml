name: CI Gate

# Aggregator check that turns green when every other required check on
# this PR has passed. Set this as the single required status check in
# branch protection rather than enumerating each workflow -- that way
# adding a new workflow doesn't require updating branch protection.
#
# Mirrors dirsql's pr-monitor pattern.

on:
  pull_request:

concurrency:
  # A superseded gate run polls a stale SHA until it finishes. Cancel it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  # willfire reads the PR and its changed files to predict which workflows dispatch.
  pull-requests: read

jobs:
  monitor:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The resolver below answers out of this checkout — it reads the
      # fixture directories and shells out to the `piot-ci` core, so the
      # workspace has to be installed before the gate runs.
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: thekevinscott/pr-monitor@v1
        with:
          # `build` in e2e-fixture-job.yml fans out over a matrix the engine
          # computes at runtime, so willfire can only name those 15 checks by
          # running `plan` — which its sandbox cannot do, having no network
          # for setup-pnpm. `resolve` answers them from the same core the
          # workflow itself calls, so the two cannot disagree.
          #
          # `-C` is load-bearing: willfire spawns the callback with the
          # invoker's cwd, and pr-monitor's action runs from
          # `github.action_path`, so a bare `pnpm exec` looks for this repo
          # inside the action's own checkout and exits 1.
          resolve-outputs: pnpm -C ${{ github.workspace }} exec putitoutthere resolve
