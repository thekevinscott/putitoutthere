name: Conventions

# We deliberately do NOT use the `e2e-verify` gate / e2e attestations: piot
# runs its full e2e suite in CI, which is strictly stronger than a receipt.
# A `skipped` e2e-verify job is the intended state -- never commit under
# e2e-attestations/ or set `run_e2e`. See AGENTS.md and #521.

# Gate scope is the two `source:` trees below, but two gates reach wider:
# `workflow-lint` scans .github/workflows/** (so every workflow edit must
# run the lane), and unit coverage / mutation run vitest + build, making the
# lockfile and root manifests inputs.
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'

jobs:
  ci:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: packages/ci/src

  # packages/engine meets the full testing-conventions standard: every gate
  # runs with no `gates:` filter (epic #474 / #476). The only tuning is an
  # engine-scoped `config:` that sets the one_function_per_file ratchet and
  # lifts one genuinely-equivalent mutation mutant (see
  # packages/engine/testing-conventions.toml, with a reason).
  # It is kept separate from the ci job so its engine-only
  # `[[typescript.exempt]]` paths don't error against packages/ci/src; the ci
  # job keeps the default config and needs no exemptions.
  engine:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      source: packages/engine/src
      config: packages/engine/testing-conventions.toml
