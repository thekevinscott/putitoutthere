name: Test

on:
  # The unit suite's inputs reach outside packages/**: the test/workflows
  # tier parses this repo's own workflow YAML and asserts invariants against
  # the root manifests (action.yml, putitoutthere.toml, README.md,
  # CHANGELOG.md). Dropping any entry below lets a red unit suite merge green.
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'action.yml'
      - 'putitoutthere.toml'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/**'
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./packages/ci/actions/setup-node

      - uses: ./packages/ci/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit
