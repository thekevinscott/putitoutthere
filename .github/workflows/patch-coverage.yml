name: Patch coverage

# Per-PR diff coverage gate: every line and branch introduced by this PR's
# diff in src/**/*.ts must be exercised, strict 100%, with no newly
# introduced `/* v8 ignore */` markers. CI Gate requires this job
# automatically once it appears, so branch protection needs no update.

# The gate counts added lines in `packages/engine/src/**/*.ts` only
# (`is-counted-src-path.ts` rejects everything else, including .test.ts and
# .d.ts), so that tree plus the machinery that produces the coverage JSON is
# the whole trigger set. With no counted additions the gate prints
# "no src/**/*.ts additions in this PR; passing" regardless of what else
# changed.
#
# Keep `packages/engine/src/**` a superset of `is-counted-src-path.ts`'s
# predicate — narrowing it would let new, uncovered engine lines merge
# unchecked.
on:
  pull_request:
    paths:
      - 'packages/engine/src/**'
      - 'packages/engine/package.json'
      - 'packages/engine/vitest.config.ts'
      - 'packages/ci/src/patch-coverage/**'
      - 'packages/ci/actions/**'
      - 'package.json'
      - '.github/workflows/patch-coverage.yml'

concurrency:
  group: patch-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patch-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./packages/ci/actions/setup-node

      - uses: ./packages/ci/actions/setup-pnpm

      - name: Install dependencies
        # packages/ci's `prepare` script builds its dist during install, so
        # `piot-ci` is linked into node_modules/.bin and resolvable below.
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        # The script pins `--coverage.include=src/**/*.ts` so the report lists
        # every source file, not just the ones a test imported. Type-only
        # modules (`*-types.ts`) compile to nothing and are elided at every
        # import site, so without it they are absent from the report and the
        # gate reads that as "no test ever loaded it" — a violation no test
        # can ever clear.
        run: pnpm run test:unit:coverage

      - name: Diff-coverage check (100% on new src/ lines, no escape hatches)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec piot-ci patch-coverage
