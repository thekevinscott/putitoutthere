name: Link check

# Catches link rot in README + plan docs. Runs on PR (docs-only diff)
# and scheduled weekly so external links that die don't accumulate
# silently.

on:
  pull_request:
    paths:
      # `**/*.md` alone is correct for GitHub — it reads a leading `**/` as
      # *zero or more* directories, so it matches root-level `CHANGELOG.md`
      # too. The redundant-looking `*.md` is for the CI Gate: pr-monitor's
      # willfire (0.1.2) translates `**/*.md` to `^.*\/[^/]*\.md$`, which
      # requires a literal `/`, so it predicts this workflow will NOT fire on
      # a root-level markdown change. GitHub fires it anyway, and the gate
      # then fails the PR with `Unpredicted workflow runs: [link-check.yml]`.
      # Because the changelog policy puts `CHANGELOG.md` + `MIGRATIONS.md`
      # (both root-level) in every public-surface PR, that made the gate red
      # on essentially every feature PR. Drop this line once willfire renders
      # a leading `**/` as `(?:.*/)?`.
      - '**/*.md'
      - '*.md'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '*.md'
  schedule:
    - cron: '0 5 * * 1' # 05:00 UTC Monday

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          # Excludes:
          #   - CLAUDE.md @-imports (file paths, not URLs)
          #   - claude.ai code-session reference URLs (auth-walled)
          #   - GitHub issue/PR self-refs (rate-limit + churn noise)
          #   - URLs containing template placeholders like `<your-package>` --
          #     these appear in setup walkthroughs and are intentionally not
          #     real fetchable URLs.
          #   - localhost URLs inside eval snapshots (ephemeral ports
          #     captured by the probe; meaningful as diff-against refs
          #     but not network-fetchable after the run exits).
          args: >-
            --no-progress
            --verbose
            --exclude '^@.+'
            --exclude 'https://claude\.ai/code/'
            --exclude 'https://github\.com/thekevinscott/putitoutthere/issues/\d+'
            --exclude 'https://github\.com/thekevinscott/putitoutthere/pull/\d+'
            --exclude '<[^>]+>'
            --exclude '^http://localhost[:/]'
            --exclude-path 'notes/4-17-2026-initial-plan/transcript.md'
            --exclude-path 'docs/'
            --accept '200,203,206,403,429'
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
