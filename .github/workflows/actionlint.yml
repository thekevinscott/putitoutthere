name: Actionlint

# Lints every workflow under .github/workflows/ -- bad action refs,
# expression syntax, job/step dependency typos, and shellcheck over `run:`
# blocks. Workflow drift is expensive to debug (push -> wait for runner),
# so lint locally first.

on:
  # Inputs beyond the workflow dir, all of which actionlint genuinely reads:
  # the local actions it resolves through `uses: ./` — the repo-root
  # `action.yml` and the composites #653 moved to packages/ci/actions, whose
  # `runs.main`/inputs it validates — plus the tested id-token assertion this
  # job also runs. The `push:` trigger below is left as it was; narrowing push
  # triggers is a separate decision.
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'action.yml'
      - 'packages/ci/actions/**'
      - 'packages/ci/src/actionlint-idtoken/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `dist-action/index.js` is gitignored on main and only exists on
      # tag commits (release-npm.yml folds it into the release commit).
      # actionlint validates `runs.main` paths exist for any local action
      # referenced via `uses: ./` — without the bundle present, the
      # e2e-fixture workflow's `uses: ./` step trips the existence check.
      # Build the bundle here so actionlint sees what runtime sees.
      - uses: ./packages/ci/actions/setup-node
      - uses: ./packages/ci/actions/setup-pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build action bundle
        run: pnpm run build:action

      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # Structural-safety invariant: build.yml / _matrix.yml / check.yml
      # must never grow `id-token: write`, so a PR-time run cannot mint a
      # publish-capable OIDC token (#272, #317). `pnpm install` above links
      # the `piot-ci` bin -- its `prepare` builds dist at install time.
      - name: Assert PR-time path has no id-token permission
        run: pnpm exec piot-ci actionlint-idtoken
