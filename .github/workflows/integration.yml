name: Integration

# Integration tests hit msw-mocked registries (no real network). Safe to
# run on every push + PR.
#
# Full harness spec: #27.

on:
  push:
    branches: [main]
  # Mocked-registry suite over packages/**. One non-obvious input:
  # resolve.integration.test.ts runs `resolve` against the REAL repo root, and
  # `run-resolve.ts` reads `.github/workflows/e2e-fixture-job.yml` (the
  # callback key) plus packages/engine/tests/fixtures/ (the fixture list). So
  # editing that one workflow file can turn this suite red, and it has to be a
  # trigger. No other workflow file is read, so the rest of
  # `.github/workflows/**` stays out.
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-fixture-job.yml'
      - '.github/workflows/integration.yml'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./packages/ci/actions/setup-node

      - uses: ./packages/ci/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration suite
        run: pnpm run test:integration
